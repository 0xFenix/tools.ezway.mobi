<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J2ME Merger — gộp game menu</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
  #drop { border: 2px dashed #999; border-radius: 8px; padding: 28px; text-align: center; color: #555; }
  #drop.over { border-color: #1a7f37; background: #f0fff4; }
  .warn { color: #b26a00; margin-top: 12px; }
  .row { margin-top: 12px; }
  #status { margin-top: 12px; white-space: pre-wrap; }
  button { padding: 8px 20px; font-size: 15px; }
</style>
</head>
<body>
<h2>J2ME Merger — gộp game thành menu</h2>
<div id="drop">Kéo-thả file .jar vào đây<br>hoặc <button id="pick" type="button">Chọn file...</button>
  <div id="fname"></div>
</div>
<input id="file" type="file" accept=".jar" hidden>
<div class="row">
  <label>Số bản (copies, 1–10): <input id="copies" type="number" min="1" max="10" value="6"></label>
</div>
<div class="row"><button id="go">Bắt đầu ghép</button></div>
<div id="status"></div>
<p class="warn">Lưu ý: không phải file jar nào cũng ghép được — file obfuscate quá nặng, thiếu preverify, mã hóa dị hoặc bytecode sửa ẩu có thể merge thành công những lỗi khi chuyển đổi list ghép.</p>
<script>
var file = null;
var drop = document.getElementById('drop');
var input = document.getElementById('file');
document.getElementById('pick').onclick = function() { input.click(); };
input.onchange = function() { setFile(input.files[0]); };
function setFile(f) {
  if (!f) return;
  if (!/\.jar$/i.test(f.name)) { status('Chỉ nhận file .jar'); return; }
  file = f;
  document.getElementById('fname').textContent = f.name + ' (' + f.size + ' bytes)';
}
['dragenter','dragover'].forEach(function(e){ drop.addEventListener(e, function(ev){ ev.preventDefault(); drop.classList.add('over'); }); });
['dragleave','drop'].forEach(function(e){ drop.addEventListener(e, function(ev){ ev.preventDefault(); drop.classList.remove('over'); }); });
drop.addEventListener('drop', function(ev) {
  var f = ev.dataTransfer.files && ev.dataTransfer.files[0];
  setFile(f);
});
function status(s) { document.getElementById('status').textContent = s; }
document.getElementById('go').onclick = function() {
  if (!file) { status('Chọn 1 file game .jar trước.'); return; }
  var copies = Math.max(1, Math.min(10, parseInt(document.getElementById('copies').value || '6', 10)));
  var fd = new FormData();
  fd.append('game', file, file.name);
  fd.append('copies', copies);
  status('Đang ghép ' + file.name + ' x' + copies + ' ...');
  fetch('/api/merge', { method: 'POST', body: fd }).then(function(res) {
    if (!res.ok) return res.text().then(function(t) { throw new Error(t); });
    var cd = res.headers.get('Content-Disposition') || '';
    var m = /filename="([^"]+)"/.exec(cd);
    var name = m ? m[1] : (file.name.replace(/\.jar$/i, '') + '-menu-x' + copies + '.jar');
    return res.blob().then(function(b) { return { blob: b, name: name }; });
  }).then(function(r) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(r.blob);
    a.download = r.name;
    a.click();
    status('Xong: ' + r.name);
  }).catch(function(err) { status('Lỗi: ' + err.message); });
};
</script>
</body>
</html>
